<article> 
  <div>
    <h3>{{ post.tags.title }}</h3>
  </div>
  
  <h2>{{ post.title }}</h2> 

  <p [class.multiPosts]="multiPosts">{{ post.content }}</p>

  <footer>
    <a [routerLink]="['/post', post.id]" *ngIf="multiPosts">Ver Mais</a>
    <div>
      <button aria-label="Salvar postagem">
        <ion-icon name="bookmark-outline"></ion-icon>
      </button>
    </div>
  </footer>
</article>
