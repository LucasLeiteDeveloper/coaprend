<ion-header class="subpage-header">
  <ion-toolbar class="content-container">
    <ion-buttons slot="start">
      <ion-button slot="icon-only" aria-label="Voltar" fill="clear" (click)="cancel()">teste</ion-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div *ngIf="inputType == 'text'">
    <ion-input
      [(ngModel)]="inputValue"
      type="text"
      placeholder="Digite aqui"
      label="Digite aqui"
      labelPlacement="stacked"
    ></ion-input>
  </div>
  <div *ngIf="inputType == 'calendar'">
    <ion-input
      [(ngModel)]="inputValue"
      type="calendar"
      label="Selecione a data"
      labelPlacement="stacked"
    ></ion-input>
  </div>
  <div *ngIf="inputType == 'tags'">
    <ion-list *ngIf="tags && tags.length > 0">
      <ion-item *ngFor="let tag of tagSelections">
        <ion-label> {{ tag.tag }} </ion-label>

        <ion-checkbox
          slot="end"
          [checked]="tag.selected"
          (ionChange)="toggleTag(tag.tag)"
        ></ion-checkbox>
      </ion-item>
    </ion-list>

     <div *ngIf="tags && tags.length === 0" class="ion-text-center ion-padding">
      <p>Nenhuma tag disponível</p>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="full" (click)="confirm()">Confirmar</ion-button>
  </ion-toolbar>
</ion-footer>
