<app-header-class-page/>

<app-header-class-nav
  [classId]="classId"
  [selectedTab]="selectedTab"
/>

<ion-content class="ion-padding" [scrollEvents]="true" (ionScroll)="scroll.onContentScroll($event)">
  <router-outlet/>
</ion-content>

<app-footer-nav
  [selectedTab]='"class"'
  [classId]='classId'
  [class.hidden]="scroll.isHidden"
/>

<!-- POPUPS -->

<!-- The trigger is in the header-class-page component -->
<ion-popover trigger="tags-popup-trigger">
  <ng-template>
    <div class="ion-padding tag-selector">
      <div *ngFor="let tag of tags" class="tag-option" [class]="tag.color" [class.selected]="tag.selected" [id]="['tag' + tag.id]" (click)="selectTag(tag.id)">
        <ion-icon [name]="tag.icon"></ion-icon>
        <p>{{ tag.text }}</p>
      </div>
    </div>
  </ng-template>
</ion-popover>

<!-- The trigger is in the footer-nav component -->
<ion-popover trigger="create-popup-trigger">
  <ng-template>
    <menu-criacao></menu-criacao>
  </ng-template>
</ion-popover>
