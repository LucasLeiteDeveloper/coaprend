<main class="content-container grid-spacing-b">
	<h1 class="ion-text-center"><strong>Entrar</strong></h1>
	<div class="grid-spacing-m">
		<form #loginForm="ngForm" class="app-form">
			<div>
				<input type="email" name="email" [(ngModel)]="userData.email" placeholder=" "/>
				<label for="email">Email</label>
			</div>
			<div>
				<input type="password" name="password" [(ngModel)]="userData.password" placeholder=" "/>
				<label for="password">Password</label>
			</div>
			<button (click)="submitForm()">Continuar</button>
		</form>

		<p>OU</p>

		<button (click)="googleLogin()" class="google-btn">
			<img src="https://www.gstatic.com/marketing-cms/assets/images/d5/dc/cfe9ce8b4425b410b49b7f2dd3f3/g.webp=s96-fcrop64=1,00000000ffffffff-rw" alt="Logo do Google">
			<span>Continar com Google</span>
		</button>
	</div>

	<div class="grid-spacing-m">
		<p><a routerLink="/forgot-password">Esqueceu sua senha?</a></p>
		<p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a>.</p>
	</div>
</main>
<ion-toast trigger="test" message="This toast will disappear after 5 seconds" [duration]="5000"></ion-toast>
